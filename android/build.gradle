group 'com.mahatech.flutter_pax_printer_utility'
version '1.0'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {

    lint {
        checkReleaseBuilds false
    }

    namespace "com.mahatech.flutter_pax_printer_utility"

    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdkVersion 19
        consumerProguardFiles 'consumer-rules.pro'
    }
}

dependencies {
    // PAX POSLink Peripheries SDK V2.02.00G_20260228: the core library, the
    // peripheries plugin and the PAX logging library it needs. The SDK's optional
    // GLComm (Bluetooth and serial) and GLExtPrinter (Bluetooth printer) jars and its
    // native libraries are not needed for the built-in printer.
    implementation files('libs/POSLink_Core_Android_V2.00.13_20260228.jar')
    implementation files('libs/POSLink_Peripheries_Android_Plugin_V2.02.00G_20260228.jar')
    implementation files('libs/PaxLog_1.1.0_20260228.jar')
    implementation 'com.google.zxing:core:3.5.4'

    testImplementation 'junit:junit:4.13.2'
}
